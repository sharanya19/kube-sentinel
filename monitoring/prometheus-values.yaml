# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics.
# Sized for a single-node minikube cluster.

prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 15s
    # Pick up ServiceMonitors / PodMonitors / rules from any namespace, not only this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }

grafana:
  # Local demo login. Change this if you ever expose Grafana outside your laptop.
  adminUser: admin
  adminPassword: kube-sentinel
  defaultDashboardsTimezone: browser
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

# minikube runs these control-plane parts in a way Prometheus can't reach; skip them to avoid noisy "down" alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
