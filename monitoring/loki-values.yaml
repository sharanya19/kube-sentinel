# Loki in Monolithic mode (one pod, local disk), the simplest setup for a laptop cluster.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Log-based alerts (loki-rules.yaml): rule files land in /rules/<tenant>/ via the rules sidecar.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /var/loki/ruler-scratch
    alertmanager_url: http://kps-kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    enable_alertmanager_v2: true
    enable_api: true
    evaluation_interval: 30s
    wal:
      dir: /var/loki/ruler-wal

sidecar:
  rules:
    folderAnnotation: k8s-sidecar-target-directory

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Turn off the scalable / cache / test components; Monolithic mode doesn't need them.
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
