# Grafana Alloy: runs on every node, reads all container logs and sends them to Loki.
alloy:
  configMap:
    content: |
      // Find every pod in the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Turn Kubernetes metadata into Loki labels (namespace, pod, container, app).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // Stream the logs through the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // Also capture Kubernetes events (OOMKilled, BackOff, Scaled...) as log lines.
      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  # One Alloy is enough: it reads logs through the Kubernetes API, not from node disks.
  type: deployment
  replicas: 1
