apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ks.name" . }}
  labels: {{- include "ks.labels" . | nindent 4 }}
---
# Read-only view of what the investigation tools need. No Secrets, no write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ks.name" . }}-read
  labels: {{- include "ks.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ks.name" . }}-read
  labels: {{- include "ks.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ks.name" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "ks.name" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.actions.enabled }}
{{- range .Values.actions.namespaces }}
---
# The only writes: what scale / rollout restart / rollout undo need, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ks.name" $ }}-actions
  namespace: {{ . }}
  labels: {{- include "ks.labels" $ | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ks.name" $ }}-actions
  namespace: {{ . }}
  labels: {{- include "ks.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ks.name" $ }}-actions
subjects:
  - kind: ServiceAccount
    name: {{ include "ks.name" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
